<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<!-- design/social-preview.html - the 1280x640 GitHub social preview.
     Rendered to design/social-preview.png. The section on the right is
     design/promo/hero-canvas.png, captured from the running app on the
     committed synthetic fixtures - no real survey, here or anywhere. -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1280px;height:640px;overflow:hidden}
  body{position:relative;font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;
       background:linear-gradient(180deg,#0B1220 0%,#111C2E 100%);color:#fff}
  #shot{position:absolute;top:0;right:0;width:820px;height:640px;overflow:hidden}
  #shot img{height:820px;width:auto;position:absolute;right:-210px;top:-90px;opacity:.95;max-width:none}
  #fade{position:absolute;top:0;right:0;width:900px;height:640px;pointer-events:none;
        background:linear-gradient(90deg,#0B1220 0%,rgba(11,18,32,.9) 24%,rgba(11,18,32,0) 66%)}
  #left{position:absolute;left:80px;top:0;height:640px;width:700px;display:flex;
        flex-direction:column;justify-content:center;z-index:2}
  #brand{display:flex;align-items:center;gap:26px}
  #logo{width:96px;height:96px;display:block}
  #wordmark{font-size:92px;font-weight:800;letter-spacing:-1px;line-height:1;color:#fff}
  #underline{width:132px;height:4px;border-radius:2px;background:#00C853;margin:30px 0 22px 2px}
  #tagline{font-size:30px;font-weight:400;color:#9DB2CE;line-height:1.35;max-width:600px}
  #chips{position:absolute;left:82px;bottom:54px;display:flex;gap:12px;flex-wrap:wrap;z-index:2}
  .chip{font-size:20px;font-weight:600;color:#C7D6EC;background:rgba(255,255,255,.06);
        border:1px solid rgba(157,178,206,.28);border-radius:999px;padding:8px 18px}
</style>
</head>
<body>
  <div id="bg"></div>
  <div id="shot"><img src="promo/hero-canvas.png" alt="A SeisConv section"/></div>
  <div id="fade"></div>
  <div id="left">
    <div id="brand"><img id="logo" src="../build/icon.png" alt=""/><div id="wordmark">SeisConv</div></div>
    <div id="underline"></div>
    <div id="tagline">Open a SEG-Y and see it.<br/>Convert, view, and QC field seismic data.</div>
  </div>
  <div id="chips">
    <span class="chip">SEG-Y</span><span class="chip">SEG-D</span><span class="chip">SEG-2</span>
    <span class="chip">SU</span><span class="chip">SPS</span><span class="chip">P1/11</span>
  </div>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="SeisConv app icon — seismic trace converting through an arrow">
  <defs>
    <radialGradient id="i3-bg" cx="30%" cy="20%" r="100%">
      <stop offset="0%" stop-color="#1b3b5b"/>
      <stop offset="52%" stop-color="#10273f"/>
      <stop offset="100%" stop-color="#091624"/>
    </radialGradient>
    <!-- input trace: dimmer teal -->
    <linearGradient id="i3-in" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1aa39c"/>
      <stop offset="100%" stop-color="#13807b"/>
    </linearGradient>
    <!-- output trace: bright cyan -->
    <linearGradient id="i3-out" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8af6ee"/>
      <stop offset="100%" stop-color="#2fd3ca"/>
    </linearGradient>
    <!-- conversion arrow -->
    <linearGradient id="i3-arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34dbd0"/>
      <stop offset="100%" stop-color="#1fc8c0"/>
    </linearGradient>
    <linearGradient id="i3-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="36%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="i3-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34dbd0" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#34dbd0" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="i3-clip"><rect x="0" y="0" width="512" height="512" rx="114"/></clipPath>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="114" fill="url(#i3-bg)"/>

  <g clip-path="url(#i3-clip)">
    <!-- two baseline rails -->
    <g stroke="#274d70" stroke-opacity="0.5" stroke-width="3">
      <line x1="78"  y1="118" x2="78"  y2="394"/>
      <line x1="434" y1="118" x2="434" y2="394"/>
    </g>

    <!-- INPUT seismic trace (left) -->
    <path fill="none" stroke="url(#i3-in)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"
      d="M 78 122
         C 150 158, 18 196, 96 234
         C 168 268, 30 308, 96 346
         C 130 366, 70 384, 78 392"/>

    <!-- OUTPUT seismic trace (right) — same waveform, brighter + variable-area fill -->
    <path fill="url(#i3-fill)" stroke="none"
      d="M 434 122
         C 506 158, 374 196, 452 234
         C 524 268, 386 308, 452 346
         C 486 366, 426 384, 434 392
         L 434 392 Z"/>
    <path fill="none" stroke="url(#i3-out)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"
      d="M 434 122
         C 506 158, 374 196, 452 234
         C 524 268, 386 308, 452 346
         C 486 366, 426 384, 434 392"/>

    <!-- Central conversion arrow: bold, the dominant small-size read -->
    <g transform="translate(256 256)">
      <path fill="url(#i3-arrow)" stroke="#0a1828" stroke-width="6" stroke-linejoin="round"
        d="M -72 -34
           L 28 -34
           L 28 -70
           L 96 0
           L 28 70
           L 28 34
           L -72 34
           Z"/>
    </g>
  </g>

  <rect x="0" y="0" width="512" height="512" rx="114" fill="url(#i3-sheen)"/>
</svg>

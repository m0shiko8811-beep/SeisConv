<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="SeisConv app icon - concentric seismic waves over a survey grid">
  <defs>
    <radialGradient id="i2-bg" cx="50%" cy="30%" r="95%">
      <stop offset="0%" stop-color="#193752"/>
      <stop offset="50%" stop-color="#0f2640"/>
      <stop offset="100%" stop-color="#0a1828"/>
    </radialGradient>
    <!-- Epicenter glow -->
    <radialGradient id="i2-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9bfff7"/>
      <stop offset="40%" stop-color="#34dbd0"/>
      <stop offset="100%" stop-color="#1fc8c0"/>
    </radialGradient>
    <linearGradient id="i2-wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34dbd0"/>
      <stop offset="100%" stop-color="#1fc8c0"/>
    </linearGradient>
    <linearGradient id="i2-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="36%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Fade the grid out toward the tile edges -->
    <radialGradient id="i2-gridfade" cx="50%" cy="56%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="i2-gridmask">
      <rect x="0" y="0" width="512" height="512" fill="url(#i2-gridfade)"/>
    </mask>
    <clipPath id="i2-clip"><rect x="0" y="0" width="512" height="512" rx="114"/></clipPath>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="114" fill="url(#i2-bg)"/>

  <g clip-path="url(#i2-clip)">
    <!-- Survey grid in perspective, faded by the radial mask -->
    <g mask="url(#i2-gridmask)" stroke="#3a78ad" stroke-opacity="0.55" stroke-width="2.4" fill="none">
      <!-- horizontal lines, spacing widens downward (perspective) -->
      <line x1="-40" y1="300" x2="552" y2="300"/>
      <line x1="-40" y1="332" x2="552" y2="332"/>
      <line x1="-40" y1="370" x2="552" y2="370"/>
      <line x1="-40" y1="416" x2="552" y2="416"/>
      <line x1="-40" y1="470" x2="552" y2="470"/>
      <!-- converging verticals toward a vanishing point at (256,150) -->
      <line x1="256" y1="150" x2="-60" y2="500"/>
      <line x1="256" y1="150" x2="60" y2="500"/>
      <line x1="256" y1="150" x2="160" y2="500"/>
      <line x1="256" y1="150" x2="256" y2="500"/>
      <line x1="256" y1="150" x2="352" y2="500"/>
      <line x1="256" y1="150" x2="452" y2="500"/>
      <line x1="256" y1="150" x2="572" y2="500"/>
    </g>

    <!-- Concentric seismic waves radiating from the epicenter -->
    <g fill="none" stroke="url(#i2-wave)" stroke-linecap="round">
      <circle cx="256" cy="212" r="68"  stroke-width="22" stroke-opacity="1"/>
      <circle cx="256" cy="212" r="116" stroke-width="18" stroke-opacity="0.72"/>
      <circle cx="256" cy="212" r="162" stroke-width="14" stroke-opacity="0.46"/>
      <circle cx="256" cy="212" r="206" stroke-width="11" stroke-opacity="0.24"/>
    </g>

    <!-- Epicenter -->
    <circle cx="256" cy="212" r="30" fill="url(#i2-core)"/>
    <circle cx="256" cy="212" r="12" fill="#0a1828"/>
  </g>

  <rect x="0" y="0" width="512" height="512" rx="114" fill="url(#i2-sheen)"/>
</svg>

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: typecheck / build / core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Core unit tests
        # File-backed tests skip automatically when local fixtures are absent,
        # so this is green in CI without any real data.
        run: npm run test:core

  # The Playwright `_electron` end-to-end suite (`npm run qa`) is deliberately
  # NOT run here. Seven of its twelve steps drive real SEG-Y, SEG-D and SPS
  # survey files that are field data and are not in this repository, so on a
  # hosted runner it can never reach 12/12. Running it here produced a red
  # cross on every commit for an expected condition, which is worse than no
  # signal at all: it trains everyone to ignore CI. The full 12/12 run is done
  # locally against real data before every release.
